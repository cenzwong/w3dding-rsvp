<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date | Issac & Cenz</title>
    
    <!-- Using Tailwind CSS for elegant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importing a nice serif font for a wedding theme -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;z
        }
        
        /* Subtle fade-in animation for the card */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-stone-50 text-stone-800 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden fade-in border border-stone-100 relative">
        
        <!-- Decorative Header -->
        <div class="h-32 bg-stone-200 relative overflow-hidden flex items-center justify-center">
            <!-- Simple decorative background pattern using Tailwind gradients -->
            <div class="absolute inset-0 bg-gradient-to-tr from-rose-100 to-teal-50 opacity-80"></div>
            <span class="text-4xl relative z-10">💍</span>
        </div>

        <!-- Content Area -->
        <div class="p-8 text-center">
            <h1 class="font-serif text-3xl font-semibold mb-2 text-stone-800">Issac & Cenz</h1>
            <p class="text-sm tracking-widest text-stone-500 uppercase mb-6">Are getting married</p>
            
            <div class="mb-8">
                <p class="text-stone-600 mb-2">June 29, 2026</p>
                <p class="text-stone-600 text-sm">War Memorial Building, Harrow School</p>
            </div>

            <!-- Status and Interactive Elements -->
            <div class="bg-stone-50 rounded-lg p-6 border border-stone-100">
                <!-- Loader Animation -->
                <div id="loader" class="flex justify-center mb-4">
                    <svg class="animate-spin h-6 w-6 text-rose-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
                
                <p id="status-message" class="text-sm text-stone-500 mb-4 transition-opacity duration-300">
                    Preparing your calendar invitation...
                </p>

                <!-- Fallback button -->
                <button 
                    onclick="triggerManualDownload()" 
                    class="w-full bg-stone-800 hover:bg-stone-700 text-white font-medium py-3 px-6 rounded-full transition-colors duration-200 flex items-center justify-center gap-2"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download Again
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Core function to generate and download the .ics file
         */
        function downloadICS() {
            // The exact template provided
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Issac and Cenz Wedding//EN
CALSCALE:GREGORIAN
BEGIN:VEVENT
SUMMARY:🎉 Issac & Cenz Wedding
DTSTART:20260629T100000Z
DTEND:20260629T130000Z
LOCATION:War Memorial Building\\, Harrow School\\, Harrow HA1 3HL
DESCRIPTION:誠邀您出席 Issac & Cenz 嘅婚禮！\\nJoin us to celebrate the wedding of Issac and Cenz!\\n\\n地圖 / Map: https://maps.app.goo.gl/jc8KRyaF3cfCTYHb7\\n邀請函 / Invitation PDF: https://cenzwong.github.io/w3dding-rsvp/invitation.pdf
STATUS:CONFIRMED
SEQUENCE:0
END:VEVENT
END:VCALENDAR`;

            // Convert line breaks to CRLF as required by ICS spec
            const formattedIcs = icsContent.replace(/\n/g, "\r\n");
            
            // Create a blob from the formatted string
            const blob = new Blob([formattedIcs], { type: 'text/calendar;charset=utf-8' });
            
            // Create a temporary anchor element and trigger download
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Issac_Cenz_Wedding.ics');
            
            // Append, click, and remove
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        /**
         * Update the UI state after download triggers
         */
        function setDownloadedState() {
            const loader = document.getElementById('loader');
            const statusMessage = document.getElementById('status-message');
            
            if (loader) loader.style.display = 'none';
            if (statusMessage) {
                statusMessage.innerHTML = 'Download initiated! <br/> <span class="text-xs mt-1 block">Check your downloads folder. If it didn\'t start automatically, use the button below.</span>';
            }
        }

        /**
         * Triggered when the user explicitly clicks the fallback button
         */
        function triggerManualDownload() {
            downloadICS();
            setDownloadedState();
        }

        /**
         * Automatic download trigger on page load
         */
        window.onload = function() {
            // Add a slight delay (1.5s) before auto-downloading. 
            // This allows the user to see the page and understand what is happening 
            // before the browser download popup appears.
            setTimeout(() => {
                try {
                    downloadICS();
                    setDownloadedState();
                } catch (error) {
                    console.error("Auto-download failed:", error);
                    document.getElementById('status-message').innerText = "Auto-download blocked by browser. Please click the button below.";
                    document.getElementById('loader').style.display = 'none';
                }
            }, 1500);
        };
    </script>
</body>
</html>
